plugins { id 'com.android.application' }
android {
    namespace 'live.pharmaradio.reponsevoice.autonome'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'live.pharmaradio.reponsevoice.autonome'; minSdk 33; targetSdk 35; versionCode 16; versionName '0.16' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon.spake2-java:spake2-android:2.2.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    testImplementation 'junit:junit:4.13.2'
}
